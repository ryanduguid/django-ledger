[project]
name = "django-ledger"
version = "0.8.5"
readme = "README.md"
requires-python = ">=3.11"
description = "Double entry accounting system built on the Django Web Framework."
keywords = ["django", "finance", "bookkeeping", "accounting", "balance sheet", "income statement", "general ledger", "money", "engine"]
license = "GPL-3.0-or-later"
authors = [
    { name = "Miguel Sanda", email = "msanda@edmagroup.com" }
]
maintainers = [
    { name = "Miguel Sanda", email = "msanda@edmagroup.com" }
]
dependencies = [
    "django>=4.2",
    "django-treebeard>=7.0.0",
    "faker>=37.6.0",
    "fpdf2>=2.8.4",
    "markdown>=3.9",
    "ofxtools>=0.9.5",
    "pillow>=11.3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: End Users/Desktop"
]

[project.urls]
"Homepage" = "https://www.djangoledger.com"
"Bug Tracker" = "https://github.com/arrobalytics/django-ledger/issues"
"Documentation" = "https://django-ledger.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/arrobalytics/django-ledger"


[dependency-groups]
dev = [
    "django-debug-toolbar>=6.0.0",
    "jupyterlab>=4.6.4",
    "myst-parser>=4.0.1",
    "notebook>=7.6.3",
    "renku-sphinx-theme>=0.5.0",
    "sphinx>=8.2.3",
]
readthedocs = [
    "django-debug-toolbar>=6.0.0",
    "myst-parser>=4.0.1",
    "renku-sphinx-theme>=0.5.0",
    "sphinx>=8.2.3",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "dev_env",
    "dev_env.*",
    "docs",
    "docs.*",
    "assets",
    "assets.*",
    "docs.source",
    "docs.source.*",
    "notebooks",
    "notebooks.*",
]

[tool.uv]
constraint-dependencies = [
    "fonttools>=4.65.0",
    "urllib3>=2.8.0",
    "tornado>=6.5.10",
    "platformdirs>=4.11.14",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
